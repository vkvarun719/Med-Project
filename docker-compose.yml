version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./clinic.db}
      - STATION_API_KEY=${STATION_API_KEY:-clinic-secret-pi-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - backend_barcodes:/app/barcodes
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - clinic_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-http://localhost:8000}
    container_name: clinic_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clinic_net

volumes:
  backend_barcodes:
  backend_data:

networks:
  clinic_net:
    driver: bridge
